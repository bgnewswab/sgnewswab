<!-- JAVASCRIPT LOGIC -->
<script>
    // 1. Global Array Declaration
    let articles = [];
    const DEFAULT_FALLBACK_IMG = "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800";

    // 2. Initial Load Event
    document.addEventListener("DOMContentLoaded", () => {
        setupDate();
        initNewsApp();
    });

    function setupDate() {
        const dateElement = document.getElementById('current-date');
        if (dateElement) {
            dateElement.innerText = "📅 " + new Date().toLocaleDateString('hi-IN', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
        }
    }

    // 3. Robust Async Fetch with Cache-Busting & Fallback Handling
    async function initNewsApp() {
        const newsContainer = document.getElementById('news-container');

        if (newsContainer) {
            newsContainer.innerHTML = `
                <div class="col-span-2 text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-red-600 border-t-transparent"></div>
                    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400 font-bold">ताज़ा खबरें लोड हो रही हैं...</p>
                </div>
            `;
        }

        const jsonPaths = [
            `./data/news.json?v=${Date.now()}`,
            `./news.json?v=${Date.now()}`
        ];

        let loadedSuccessfully = false;

        for (const path of jsonPaths) {
            try {
                const response = await fetch(path, { cache: "no-store" });
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        articles = data;
                        loadedSuccessfully = true;
                        break;
                    }
                }
            } catch (err) {
                console.warn(`Failed loading from ${path}:`, err);
            }
        }

        if (!loadedSuccessfully || articles.length === 0) {
            if (newsContainer) {
                newsContainer.innerHTML = `
                    <div class="col-span-2 text-center py-10 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 shadow">
                        <p class="text-gray-700 dark:text-gray-300 font-bold text-base mb-1">📰 अभी कोई खबर पब्लिश नहीं हुई है</p>
                        <p class="text-xs text-gray-500">Python Bot चलाकर नई खबरें पोस्ट करें।</p>
                    </div>`;
            }
            return;
        }

        // Sort by ID descending (Latest first)
        articles.sort((a, b) => (b.id || 0) - (a.id || 0));

        // Render UI with Safety
        renderHero(articles);
        renderNews(articles);
        renderTrending(articles);
    }

    // 4. Safe Render Hero Article
    function renderHero(dataList) {
        if (!dataList || dataList.length === 0) return;

        const heroContainer = document.getElementById('hero-container');
        if (!heroContainer) return;

        const hero = dataList.find(a => a.isHero) || dataList[0];
        if (!hero) return;

        const heroLink = `./article.html?id=${hero.id}`;
        const heroImg = hero.image && hero.image.startsWith('http') ? hero.image : DEFAULT_FALLBACK_IMG;

        heroContainer.innerHTML = `
            <span class="absolute top-4 left-4 bg-red-600 text-white text-xs font-extrabold px-3 py-1 rounded shadow uppercase z-10">
                🔴 LIVE BREAKING
            </span>
            <a href="${heroLink}">
                <img src="${heroImg}" onerror="this.src='${DEFAULT_FALLBACK_IMG}'" alt="${hero.title || 'News'}" loading="lazy" class="w-full h-80 md:h-96 object-cover hover:opacity-95 transition">
            </a>
            <div class="p-6">
                <div class="flex items-center space-x-3 text-xs text-gray-500 dark:text-gray-400 mb-2">
                    <span>📅 ${hero.date || 'आज'}</span>
                    <span>⏱️ ${hero.readTime || '3 मिनट'}</span>
                    <span>👁️ ${hero.views || '1.2k'} Views</span>
                </div>
                <a href="${heroLink}">
                    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-white leading-snug hover:text-red-600 transition">
                        ${hero.title || 'शीर्षक उपलब्ध नहीं है'}
                    </h2>
                </a>
                <p class="text-gray-600 dark:text-gray-300 text-sm mt-3 line-clamp-2">
                    ${hero.summary || ''}
                </p>
                <div class="mt-4 flex items-center justify-between">
                    <a href="${heroLink}" class="text-sm font-bold text-red-600 dark:text-red-400 hover:underline">पूरा पढ़ें →</a>
                    <button onclick="shareArticle('${hero.title || 'SG News'}')" class="text-xs font-bold text-gray-500 hover:text-red-600">🔗 Share</button>
                </div>
            </div>
        `;
    }

    // 5. Safe Render News Cards Grid
    function renderNews(dataList) {
        const newsContainer = document.getElementById('news-container');
        if (!newsContainer) return;

        newsContainer.innerHTML = '';

        if (!dataList || dataList.length === 0) {
            newsContainer.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8">कोई खबर नहीं मिली।</p>`;
            return;
        }

        dataList.forEach(item => {
            const articleLink = `./article.html?id=${item.id}`;
            const itemImg = item.image && item.image.startsWith('http') ? item.image : DEFAULT_FALLBACK_IMG;

            newsContainer.innerHTML += `
                <div class="news-card bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow border border-gray-200 dark:border-gray-700 flex flex-col justify-between hover:shadow-lg transition">
                    <div>
                        <a href="${articleLink}">
                            <img src="${itemImg}" onerror="this.src='${DEFAULT_FALLBACK_IMG}'" alt="${item.title || 'News'}" loading="lazy" class="w-full h-48 object-cover hover:opacity-90 transition">
                        </a>
                        <div class="p-4">
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-red-100 dark:bg-red-900 text-red-600 dark:text-red-200">${item.category || 'News'}</span>
                            <a href="${articleLink}">
                                <h4 class="font-bold text-base mt-2 hover:text-red-600 transition text-gray-900 dark:text-white line-clamp-2">${item.title || ''}</h4>
                            </a>
                            <p class="text-xs text-gray-600 dark:text-gray-400 mt-2 line-clamp-2">${item.summary || ''}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center text-xs text-gray-500 mt-3">
                        <span>⏱️ ${item.readTime || '3 मिनट'}</span>
                        <a href="${articleLink}" class="text-red-600 dark:text-red-400 font-bold hover:underline">पूरा पढ़ें →</a>
                    </div>
                </div>
            `;
        });
    }

    // 6. Safe Render Trending Sidebar
    function renderTrending(dataList) {
        const trendingContainer = document.getElementById('trending-container');
        if (!trendingContainer) return;

        const trendingList = dataList.filter(a => a.isTrending);
        
        trendingContainer.innerHTML = '';
        if (trendingList.length === 0) {
            trendingContainer.innerHTML = `<p class="text-xs text-gray-400">कोई ट्रेंडिंग अपडेट नहीं है।</p>`;
            return;
        }

        trendingList.forEach((item, index) => {
            const articleLink = `./article.html?id=${item.id}`;
            trendingContainer.innerHTML += `
                <div class="flex items-start space-x-3 pb-3 border-b border-gray-100 dark:border-gray-700 last:border-0">
                    <span class="text-2xl font-black text-red-600 opacity-60">0${index + 1}</span>
                    <div>
                        <span class="text-[10px] font-extrabold uppercase text-gray-400">${item.category || 'News'}</span>
                        <a href="${articleLink}">
                            <h5 class="text-sm font-bold hover:text-red-600 cursor-pointer text-gray-800 dark:text-gray-200 line-clamp-2">${item.title || ''}</h5>
                        </a>
                    </div>
                </div>
            `;
        });
    }

    // 7. Category Filter Function
    function filterNews(category) {
        const titleElement = document.getElementById('section-title');
        if (category === 'all') {
            if (titleElement) titleElement.innerHTML = `<span>📰 ताज़ा ख़बरें (Latest News)</span>`;
            renderNews(articles);
        } else {
            if (titleElement) titleElement.innerHTML = `<span>📂 ${category} ख़बरें</span>`;
            const filtered = articles.filter(a => 
                (a.category && a.category.toLowerCase() === category.toLowerCase()) || 
                (category === 'Trending' && a.isTrending)
            );
            renderNews(filtered);
        }
    }

    // 8. Live Search Functionality
    function searchLiveNews() {
        const queryInput = document.getElementById('main-search');
        if (!queryInput) return;

        const query = queryInput.value.toLowerCase().trim();
        if (query === '') {
            renderNews(articles);
            return;
        }

        const filtered = articles.filter(item => 
            (item.title && item.title.toLowerCase().includes(query)) || 
            (item.summary && item.summary.toLowerCase().includes(query))
        );
        renderNews(filtered);
    }

    // 9. Scroll to Top & Reading Progress Bar
    window.onscroll = function() {
        let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        let scrolled = (winScroll / height) * 100;

        const progressBar = document.getElementById("progress-bar");
        if (progressBar) progressBar.style.width = scrolled + "%";

        const scrollBtn = document.getElementById("scrollToTop");
        if (scrollBtn) {
            if (winScroll > 300) {
                scrollBtn.classList.remove("hidden");
            } else {
                scrollBtn.classList.add("hidden");
            }
        }
    };

    // 10. Dark Mode Toggle
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        if (lightIcon) lightIcon.classList.add('hidden');
        if (darkIcon) darkIcon.classList.remove('hidden');
    }

    if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', function() {
            if (darkIcon) darkIcon.classList.toggle('hidden');
            if (lightIcon) lightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    }

    // 11. Voice Assist
    function toggleSpeech() {
        if ('speechSynthesis' in window && articles.length > 0) {
            let heroTitle = articles[0].title;
            let msg = new SpeechSynthesisUtterance(heroTitle);
            msg.lang = 'hi-IN';
            window.speechSynthesis.speak(msg);
        } else {
            alert("कोई खबर उपलब्ध नहीं है या आपका ब्राउज़र स्पीच सपोर्ट नहीं करता।");
        }
    }

    // 12. Social Share Utility
    function shareArticle(title) {
        if (navigator.share) {
            navigator.share({
                title: title,
                url: window.location.href
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert("लिंक कॉपी हो गया है!");
        }
    }

    // 13. Newsletter Handling
    function handleSubscribe(e) {
        e.preventDefault();
        alert("धन्यवाद! आपका ईमेल सब्सक्राइब हो गया है।");
        e.target.reset();
    }
</script>
