<!DOCTYPE html>
<html lang="hi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG News - देश-दुनिया की ताज़ा और निष्पक्ष ख़बरें</title>
    
    <!-- Dynamic & Primary Meta Tags -->
    <meta name="description" content="SG News पर पढ़ें देश, दुनिया, खेल, राजनीति, टेक्नोलॉजी और जॉब्स की सबसे तेज़ और सटीक हिंदी खबरें।">
    <meta name="keywords" content="SG News, Hindi News, Latest News, Breaking News Hindi, Sports News, Politics">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://bgnewswab.github.io/sgnewswab/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bgnewswab.github.io/sgnewswab/">
    <meta property="og:title" content="SG News Portal - ताज़ा ख़बरें">
    <meta property="og:description" content="देश-दुनिया और खेल जगत की हर बड़ी अपडेट पढ़ें SG News पर।">
    <meta property="og:image" content="https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://bgnewswab.github.io/sgnewswab/">
    <meta property="twitter:title" content="SG News Portal">
    <meta property="twitter:description" content="देश-दुनिया और खेल जगत की हर बड़ी अपडेट पढ़ें SG News पर।">

    <!-- JSON-LD Structured Data (Organization & Website Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "SG News",
      "url": "https://bgnewswab.github.io/sgnewswab/",
      "logo": "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800",
      "sameAs": []
    }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#DC2626' } } }
        }
    </script>
    
    <style>
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 35s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }
        #progress-bar { position: fixed; top: 0; left: 0; height: 4px; background-color: #DC2626; width: 0%; z-index: 100; transition: width 0.1s ease; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <!-- Reading Progress Bar -->
    <div id="progress-bar"></div>

    <!-- 1. TOP UTILITY BAR -->
    <div class="bg-gray-900 text-gray-300 text-xs py-1.5 px-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <span id="current-date">📅 लोड हो रहा है...</span>
                <span id="weather-info">☀️ 30°C नई दिल्ली</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="#live-tv" class="text-red-500 font-bold flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span> LIVE TV</a>
                <button onclick="toggleVoiceAssist()" aria-label="Voice Assist" class="hover:text-white">🔊 Voice Assist</button>
            </div>
        </div>
    </div>

    <!-- 2. MAIN HEADER & LOGO -->
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="./index.html" class="flex items-center space-x-3">
                <span class="bg-red-600 text-white font-extrabold text-3xl px-3 py-1 rounded shadow">SG</span>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-red-600 dark:text-red-500">SG NEWS</h1>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 font-bold tracking-widest uppercase">सत्य और सटीकता सबसे पहले</p>
                </div>
            </a>

            <div class="flex items-center space-x-3">
                <div class="relative hidden md:block">
                    <input type="text" id="main-search" onkeyup="searchLiveNews()" placeholder="खबरें खोजें (Title, Content)..." 
                        class="bg-gray-100 dark:bg-gray-700 text-sm rounded-full pl-9 pr-4 py-2 w-64 focus:outline-none border dark:border-gray-600">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                </div>

                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle" aria-label="Toggle Theme" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                    <span id="theme-toggle-dark-icon" class="hidden">🌙</span>
                    <span id="theme-toggle-light-icon">☀️</span>
                </button>
            </div>
        </div>

        <!-- MAIN NAVIGATION -->
        <nav class="bg-gray-900 text-white border-t border-red-600">
            <div class="max-w-7xl mx-auto px-4 flex items-center space-x-1 overflow-x-auto text-sm font-bold py-2">
                <button onclick="filterNews('all')" class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded transition">Home</button>
                <button onclick="filterNews('Trending')" class="px-3 py-1 hover:bg-gray-800 rounded transition">🔥 Trending</button>
                <button onclick="filterNews('Politics')" class="px-3 py-1 hover:bg-gray-800 rounded transition">🗳️ राजनीति</button>
                <button onclick="filterNews('Sports')" class="px-3 py-1 hover:bg-gray-800 rounded transition">🏏 खेल</button>
                <button onclick="filterNews('Tech')" class="px-3 py-1 hover:bg-gray-800 rounded transition">📱 टेक्नोलॉजी</button>
                <button onclick="filterNews('Jobs')" class="px-3 py-1 hover:bg-gray-800 rounded transition">💼 नौकरी</button>
            </div>
        </nav>

        <!-- BREAKING TICKER -->
        <div class="bg-red-600 text-white flex items-center px-4 py-1.5 text-xs font-bold">
            <span class="bg-black text-red-500 uppercase px-2 py-0.5 rounded mr-3 shrink-0 animate-pulse">BREAKING</span>
            <div class="overflow-hidden w-full">
                <div class="ticker-move" id="ticker-text">
                    🔥 SG NEWS: ताजा ब्रेकिंग अपडेट्स और विस्तृत विश्लेषण के लिए बने रहें...
                </div>
            </div>
        </div>
    </header>

    <!-- 3. MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8 w-full">
        <div class="lg:col-span-8 space-y-10">
            <!-- HERO -->
            <section id="hero-container" class="relative bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-200 dark:border-gray-700 min-h-[200px] flex items-center justify-center">
                <p class="text-gray-400 text-sm">लोड हो रहा है...</p>
            </section>

            <!-- LATEST NEWS GRID -->
            <section>
                <h2 class="text-xl font-extrabold mb-4 border-l-4 border-red-600 pl-3" id="section-title">
                    <span>📰 ताज़ा ख़बरें (Latest News)</span>
                </h2>
                <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </section>
        </div>

        <!-- SIDEBAR -->
        <aside class="lg:col-span-4 space-y-8">
            <div class="sticky top-24 space-y-6">
                <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow border border-gray-200 dark:border-gray-700">
                    <h3 class="text-lg font-extrabold mb-4 border-b pb-2 border-red-600">🔥 Trending Updates</h3>
                    <div class="space-y-4" id="trending-container"></div>
                </div>
            </div>
        </aside>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 text-xs py-6 text-center border-t border-gray-800">
        © 2026 SG News Portal. All Rights Reserved. | <a href="./sitemap.xml" class="hover:underline">Sitemap</a>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let articles = [];
        const DEFAULT_FALLBACK_IMG = "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800";

        // Theme System Persistence
        (function initTheme() {
            const savedTheme = localStorage.getItem('color-theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        document.addEventListener("DOMContentLoaded", () => {
            setupDate();
            initThemeToggle();
            initScrollProgress();
            initNewsApp();
        });

        function setupDate() {
            const el = document.getElementById('current-date');
            if (el) el.innerText = "📅 " + new Date().toLocaleDateString('hi-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function initThemeToggle() {
            const btn = document.getElementById('theme-toggle');
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');

            if (document.documentElement.classList.contains('dark')) {
                darkIcon?.classList.remove('hidden');
                lightIcon?.classList.add('hidden');
            } else {
                lightIcon?.classList.remove('hidden');
                darkIcon?.classList.add('hidden');
            }

            btn?.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
                darkIcon?.classList.toggle('hidden', !isDark);
                lightIcon?.classList.toggle('hidden', isDark);
            });
        }

        function initScrollProgress() {
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                const bar = document.getElementById("progress-bar");
                if (bar) bar.style.width = scrolled + "%";
            });
        }

        async function initNewsApp() {
            const paths = [`./data/news.json?v=${Date.now()}`, `./news.json?v=${Date.now()}`];
            let loaded = false;

            for (const path of paths) {
                try {
                    const res = await fetch(path, { cache: "no-store" });
                    if (res.ok) {
                        articles = await res.json();
                        if (Array.isArray(articles) && articles.length > 0) {
                            loaded = true;
                            break;
                        }
                    }
                } catch (e) {}
            }

            if (!loaded || articles.length === 0) {
                document.getElementById('news-container').innerHTML = `<p class="col-span-2 text-center py-8 text-gray-500">कोई खबर उपलब्ध नहीं है।</p>`;
                return;
            }

            articles.sort((a, b) => (b.id || 0) - (a.id || 0));

            renderHero(articles);
            renderNews(articles);
            renderTrending(articles);
        }

        function renderHero(data) {
            const container = document.getElementById('hero-container');
            if (!container) return;
            const hero = data.find(a => a.isHero) || data[0];
            const link = `./article.html?id=${hero.id}`;
            const img = hero.image?.startsWith('http') ? hero.image : DEFAULT_FALLBACK_IMG;

            container.innerHTML = `
                <div class="w-full">
                    <a href="${link}">
                        <img src="${img}" onerror="this.src='${DEFAULT_FALLBACK_IMG}'" alt="${hero.title}" class="w-full h-80 md:h-96 object-cover">
                    </a>
                    <div class="p-6">
                        <span class="text-xs font-bold text-red-600 dark:text-red-400">🔴 BREAKING</span>
                        <a href="${link}">
                            <h2 class="text-2xl font-black mt-1 hover:text-red-600 transition">${hero.title}</h2>
                        </a>
                        <p class="text-sm text-gray-600 dark:text-gray-300 mt-2 line-clamp-2">${hero.summary || ''}</p>
                    </div>
                </div>`;
        }

        function renderNews(data) {
            const container = document.getElementById('news-container');
            if (!container) return;
            container.innerHTML = '';

            data.forEach(item => {
                const link = `./article.html?id=${item.id}`;
                const img = item.image?.startsWith('http') ? item.image : DEFAULT_FALLBACK_IMG;

                container.innerHTML += `
                    <div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow border border-gray-200 dark:border-gray-700 flex flex-col justify-between">
                        <div>
                            <a href="${link}"><img src="${img}" onerror="this.src='${DEFAULT_FALLBACK_IMG}'" class="w-full h-48 object-cover"></a>
                            <div class="p-4">
                                <span class="text-[10px] uppercase font-bold text-red-600">${item.category || 'News'}</span>
                                <a href="${link}"><h3 class="font-bold text-base mt-1 hover:text-red-600 line-clamp-2">${item.title}</h3></a>
                                <p class="text-xs text-gray-500 mt-2 line-clamp-2">${item.summary || ''}</p>
                            </div>
                        </div>
                        <div class="p-4 pt-0 flex justify-between items-center text-xs text-gray-400 border-t border-gray-100 dark:border-gray-700 mt-2">
                            <span>⏱️ ${item.readTime || '2 मिनट'}</span>
                            <button onclick="shareArticle('${item.title}', '${link}')" class="text-red-600 font-bold">🔗 Share</button>
                        </div>
                    </div>`;
            });
        }

        function renderTrending(data) {
            const container = document.getElementById('trending-container');
            if (!container) return;
            const trending = data.filter(a => a.isTrending || a.views > 500).slice(0, 5);

            container.innerHTML = trending.map((item, i) => `
                <div class="flex items-start space-x-3 pb-2 border-b dark:border-gray-700">
                    <span class="text-xl font-black text-red-600 opacity-60">0${i+1}</span>
                    <a href="./article.html?id=${item.id}" class="text-xs font-bold hover:text-red-600 line-clamp-2">${item.title}</a>
                </div>
            `).join('');
        }

        function searchLiveNews() {
            const q = document.getElementById('main-search').value.toLowerCase().trim();
            if (!q) { renderNews(articles); return; }
            const filtered = articles.filter(a => 
                a.title?.toLowerCase().includes(q) || 
                a.summary?.toLowerCase().includes(q) || 
                a.content?.toLowerCase().includes(q)
            );
            renderNews(filtered);
        }

        function filterNews(cat) {
            if (cat === 'all') renderNews(articles);
            else renderNews(articles.filter(a => a.category?.toLowerCase() === cat.toLowerCase() || (cat === 'Trending' && a.isTrending)));
        }

        function shareArticle(title, relativeLink) {
            const fullUrl = window.location.origin + window.location.pathname.replace('index.html', '') + relativeLink;
            if (navigator.share) {
                navigator.share({ title: title, url: fullUrl }).catch(() => {});
            } else {
                navigator.clipboard.writeText(fullUrl);
                alert('लिंक कॉपी हो गया!');
            }
        }

        function toggleVoiceAssist() {
            if ('speechSynthesis' in window && articles.length > 0) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(articles[0].title + ". " + (articles[0].summary || ""));
                msg.lang = 'hi-IN';
                window.speechSynthesis.speak(msg);
            }
        }
    </script>
</body>
</html>
