<!DOCTYPE html>
<html lang="hi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ताज़ा ख़ाबरे - SG News Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 border-b-2 border-red-600 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="bg-red-600 text-white font-extrabold text-2xl px-3 py-1 rounded">SG</span>
                <h1 class="text-2xl font-black text-red-600 dark:text-red-500">आज की ख़बरें</h1>
            </div>
            
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none">
                <span id="theme-toggle-dark-icon" class="hidden">🌙 Dark</span>
                <span id="theme-toggle-light-icon">☀️ Light</span>
            </button>
        </div>
        
        <!-- Category Navigation Bar -->
        <nav class="bg-gray-50 dark:bg-gray-700 border-t border-gray-200 dark:border-gray-600">
            <div class="max-w-7xl mx-auto px-4 flex space-x-4 overflow-x-auto py-2 text-sm font-bold">
                <button onclick="filterNews('all')" class="cat-btn px-3 py-1 bg-red-600 text-white rounded">सब (All)</button>
                <button onclick="filterNews('देश')" class="cat-btn px-3 py-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded">🇮🇳 देश</button>
                <button onclick="filterNews('Sports News')" class="cat-btn px-3 py-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded">🏏 खेल</button>
                <button onclick="filterNews('Tech')" class="cat-btn px-3 py-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded">📱 टेक</button>
                <button onclick="filterNews('Jobs')" class="cat-btn px-3 py-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded">💼 जॉब्स</button>
            </div>
        </nav>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <h2 class="text-xl font-extrabold mb-4 border-l-4 border-red-600 pl-2">मुख्य समाचार</h2>
        
        <!-- News Container (Python Bot Auto-Inserts Here) -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- RECENT_NEWS_START -->

            <div class="news-card bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden border border-gray-200 dark:border-gray-700" data-category="News">
                <img src="https://www.jagranimages.com/images/2026/08/05/article/image/Harsh-Dubey-(2)-1785916121506_m.webp" class="w-full h-48 object-cover" alt="News Image">
                <div class="p-4">
                    <span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded uppercase">News</span>
                    <h3 class="font-bold text-lg mt-2 mb-2 line-clamp-2"><a href="https://bgnewswab.github.io/sgnewswab/news_1785918569.html" class="hover:text-red-600 dark:hover:text-red-400">"IND vs SL टेस्ट: शुभमन गिल की टीम में 4 नए नेट बॉलर्स शामिल"</a></h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">05 August 2026 | 08:29 AM</p>
                    <a href="https://bgnewswab.github.io/sgnewswab/news_1785918569.html" class="text-sm font-bold text-red-600 dark:text-red-400 hover:underline">पूरा पढ़ें →</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Dark Mode JavaScript Logic -->
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.add('hidden');
            darkIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.add('hidden');
            lightIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });

        // Category Filter Logic
        function filterNews(category) {
            const cards = document.querySelectorAll('.news-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
