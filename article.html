<!DOCTYPE html>
<html lang="hi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SG News - ताज़ा ख़बरें</title>
    
    <!-- Dynamic Dynamic SEO & Meta Tags -->
    <meta name="description" id="meta-description" content="SG News Portal - ताज़ा समाचार और ताज़ातरीन अपडेट्स।">
    <link rel="canonical" id="canonical-url" href="">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="SG News">
    <meta property="og:title" id="og-title" content="SG News">
    <meta property="og:description" id="og-description" content="SG News - ताज़ा ख़बरें">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitter-title" content="SG News">
    <meta name="twitter:description" id="twitter-description" content="SG News">
    <meta name="twitter:image" id="twitter-image" content="">

    <!-- Schema.org NewsArticle (Google News Structured Data) -->
    <script type="application/ld+json" id="news-schema"></script>

    <!-- Google Hindi Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: '#DC2626' },
                    fontFamily: { sans: ['"Noto Sans Devanagari"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Devanagari', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

    <!-- 4. READING PROGRESS BAR -->
    <div id="progress-bar" class="fixed top-0 left-0 h-1 bg-red-600 z-50 transition-all duration-150 w-0"></div>

    <!-- HEADER -->
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <span class="bg-red-600 text-white font-extrabold text-2xl px-2.5 py-0.5 rounded shadow">SG</span>
                <span class="text-xl font-black text-red-600 dark:text-red-500 tracking-wide">SG NEWS</span>
            </a>
            
            <div class="flex items-center space-x-4">
                <!-- 5. DARK MODE TOGGLE BUTTON -->
                <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle Theme" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
                <a href="index.html" class="text-xs font-bold text-red-600 hover:underline hidden sm:inline">← मुख्य पृष्ठ पर लौटें</a>
            </div>
        </div>
    </header>

    <!-- MAIN ARTICLE CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- 11. BREADCRUMB -->
        <nav id="breadcrumb" class="text-xs text-gray-500 dark:text-gray-400 mb-4 hidden">
            <a href="index.html" class="hover:underline">होम</a> &gt; 
            <span id="crumb-category" class="font-medium text-gray-700 dark:text-gray-300">समाचार</span> &gt; 
            <span id="crumb-title" class="truncate inline-block max-w-[200px] align-bottom">लोड हो रहा है...</span>
        </nav>

        <div id="article-container">
            <!-- 20. SKELETON LOADING STATE -->
            <div class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-xl shadow border border-gray-200 dark:border-gray-700 animate-pulse">
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/4 mb-4"></div>
                <div class="h-8 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mb-4"></div>
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mb-6"></div>
                <div class="w-full h-80 bg-gray-200 dark:bg-gray-700 rounded-lg mb-6"></div>
                <div class="space-y-3">
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-full"></div>
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-full"></div>
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-5/6"></div>
                </div>
            </div>
        </div>

        <!-- 7. RELATED NEWS SECTION -->
        <section id="related-news-section" class="mt-10 hidden">
            <h3 class="text-xl font-bold mb-4 pb-2 border-b-2 border-red-600 inline-block">संबंधित खबरें</h3>
            <div id="related-news-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 text-xs py-6 text-center border-t border-gray-800 mt-12">
        <p>© 2026 SG News Portal. All Rights Reserved.</p>
    </footer>

    <!-- 6. TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2">
        <span>✅</span>
        <span id="toast-message">संदेश</span>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Init Theme
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-toggle-icon').innerText = '☀️';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-toggle-icon').innerText = '🌙';
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-toggle-icon').innerText = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-toggle-icon').innerText = '☀️';
            }
        }

        // 4. Reading Progress Bar Logic
        window.addEventListener("scroll", () => {
            const win = document.documentElement;
            const sc = (win.scrollTop) / (win.scrollHeight - win.clientHeight);
            document.getElementById("progress-bar").style.width = (sc * 100) + "%";
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadArticle();
        });

        async function loadArticle() {
            const container = document.getElementById('article-container');
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                showError("कोई आर्टिकल ID नहीं दी गई है।");
                return;
            }

            const paths = [
                `./data/news.json?v=${Date.now()}`,
                `./news.json?v=${Date.now()}`
            ];

            let articles = null;
            for (let path of paths) {
                try {
                    let res = await fetch(path, { cache: 'no-store' });
                    if (res.ok) {
                        articles = await res.json();
                        break;
                    }
                } catch (e) {
                    console.warn(`Failed path: ${path}`);
                }
            }

            if (!articles || !Array.isArray(articles)) {
                showError("खबरें लोड करने में समस्या हुई।");
                return;
            }

            const article = articles.find(a => String(a.id) === String(articleId));

            if (!article) {
                showError("यह आर्टिकल नहीं मिला या हटा दिया गया है।");
                return;
            }

            // 13. Automatic Reading Time Calculation
            const fullContent = article.content || article.summary || '';
            const cleanText = fullContent.replace(/<[^>]+>/g, '');
            const wordCount = cleanText.trim().split(/\s+/).length;
            const autoReadTime = `${Math.max(1, Math.ceil(wordCount / 200))} मिनट`;

            // 1, 2, 3. Update SEO & Schema
            updateSEO(article);

            // Update Breadcrumb
            document.getElementById('crumb-category').innerText = article.category || 'समाचार';
            document.getElementById('crumb-title').innerText = article.title;
            document.getElementById('breadcrumb').classList.remove('hidden');

            // Render Full Article
            container.innerHTML = `
                <article class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-xl shadow border border-gray-200 dark:border-gray-700">
                    <div class="flex flex-wrap items-center gap-3 text-xs text-gray-500 mb-4">
                        <span class="bg-red-100 text-red-600 dark:bg-red-900 dark:text-red-200 font-bold px-2 py-0.5 rounded uppercase">${article.category || 'General'}</span>
                        <span>📅 ${article.date || 'आज'}</span>
                        <span>⏱️ ${article.readTime || autoReadTime}</span>
                        <span>👁️ ${article.views || '1k'} Views</span>
                        <!-- 15. Author -->
                        <span class="text-gray-700 dark:text-gray-300 font-medium">✍️ By ${article.author || 'SG News Desk'}</span>
                    </div>

                    <h1 class="text-2xl md:text-4xl font-extrabold text-gray-900 dark:text-white leading-tight mb-6">
                        ${article.title}
                    </h1>

                    <!-- 10. Image Error Fallback -->
                    ${article.image ? `
                        <div class="mb-6">
                            <img src="${article.image}" 
                                 alt="${article.title}" 
                                 loading="lazy"
                                 onerror="this.onerror=null; this.src='https://via.placeholder.com/800x400?text=SG+News';"
                                 class="w-full h-80 md:h-[420px] object-cover rounded-lg shadow">
                            ${article.caption ? `<p class="text-xs text-gray-500 mt-1 text-center">${article.caption}</p>` : ''}
                        </div>
                    ` : ''}

                    <div class="prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-200 text-base leading-relaxed space-y-4">
                        ${article.content || `<p>${article.summary}</p>`}
                    </div>

                    <!-- 18. ADVERTISEMENT PLACEHOLDER -->
                    <div class="my-6 p-4 bg-gray-50 dark:bg-gray-700/50 border border-dashed border-gray-300 dark:border-gray-600 rounded text-center text-xs text-gray-400">
                        — ADVERTISEMENT —
                    </div>

                    <!-- 16. TAGS -->
                    ${article.tags ? `
                        <div class="mt-6 flex flex-wrap gap-2">
                            ${article.tags.map(tag => `<span class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2.5 py-1 rounded-full">#${tag}</span>`).join('')}
                        </div>
                    ` : ''}

                    <!-- 12. SOCIAL SHARE BUTTONS -->
                    <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center space-x-2 w-full sm:w-auto">
                            <span class="text-xs font-bold text-gray-500">शेयर करें:</span>
                            <button onclick="shareWhatsApp('${encodeURIComponent(article.title)}')" class="p-2 bg-green-500 text-white rounded-lg text-xs font-bold hover:bg-green-600 transition flex items-center space-x-1">
                                <span>📱 WhatsApp</span>
                            </button>
                            <button onclick="shareTwitter('${encodeURIComponent(article.title)}')" class="p-2 bg-black text-white rounded-lg text-xs font-bold hover:bg-gray-800 transition flex items-center space-x-1">
                                <span>𝕏 Twitter</span>
                            </button>
                            <button onclick="copyArticleLink()" class="p-2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-lg text-xs font-bold hover:bg-gray-300 transition">
                                🔗 कॉपी लिंक
                            </button>
                        </div>
                        <a href="index.html" class="text-sm font-bold text-red-600 hover:underline">← अन्य खबरें पढ़ें</a>
                    </div>
                </article>
            `;

            // Render Related Articles
            renderRelatedNews(articles, article);
        }

        function updateSEO(article) {
            const currentUrl = window.location.href;
            const summary = article.summary || article.title;

            document.getElementById('page-title').innerText = `${article.title} - SG News`;
            document.getElementById('meta-description').content = summary;
            document.getElementById('canonical-url').href = currentUrl;

            // OpenGraph
            document.getElementById('og-title').content = article.title;
            document.getElementById('og-description').content = summary;
            document.getElementById('og-image').content = article.image || '';
            document.getElementById('og-url').content = currentUrl;

            // Twitter
            document.getElementById('twitter-title').content = article.title;
            document.getElementById('twitter-description').content = summary;
            document.getElementById('twitter-image').content = article.image || '';

            // Schema.org
            const schemaData = {
                "@context": "https://schema.org",
                "@type": "NewsArticle",
                "headline": article.title,
                "image": [article.image || ''],
                "datePublished": article.dateIso || article.date || new Date().toISOString(),
                "dateModified": article.dateIso || article.date || new Date().toISOString(),
                "author": [{
                    "@type": "Person",
                    "name": article.author || "SG News Desk"
                }],
                "publisher": {
                    "@type": "Organization",
                    "name": "SG News",
                    "logo": {
                        "@type": "ImageObject",
                        "url": window.location.origin + "/logo.png"
                    }
                },
                "description": summary
            };
            document.getElementById('news-schema').textContent = JSON.stringify(schemaData);
        }

        function renderRelatedNews(allArticles, currentArticle) {
            const relatedGrid = document.getElementById('related-news-grid');
            const relatedSection = document.getElementById('related-news-section');

            // Filter related by same category or get top 2
            const filtered = allArticles
                .filter(a => String(a.id) !== String(currentArticle.id) && (a.category === currentArticle.category || !currentArticle.category))
                .slice(0, 2);

            if (filtered.length === 0) return;

            relatedGrid.innerHTML = filtered.map(item => `
                <a href="article.html?id=${item.id}" class="flex space-x-3 bg-white dark:bg-gray-800 p-3 rounded-lg border border-gray-200 dark:border-gray-700 hover:shadow-md transition">
                    ${item.image ? `<img src="${item.image}" alt="${item.title}" class="w-20 h-20 object-cover rounded" onerror="this.src='https://via.placeholder.com/150';">` : ''}
                    <div class="flex-1 flex flex-col justify-between">
                        <h4 class="text-sm font-bold text-gray-900 dark:text-white line-clamp-2">${item.title}</h4>
                        <span class="text-xs text-gray-400">📅 ${item.date || 'आज'}</span>
                    </div>
                </a>
            `).join('');

            relatedSection.classList.remove('hidden');
        }

        // Sharing Functions
        function shareWhatsApp(title) {
            window.open(`https://api.whatsapp.com/send?text=${title}%20${encodeURIComponent(window.location.href)}`, '_blank');
        }

        function shareTwitter(title) {
            window.open(`https://twitter.com/intent/tweet?text=${title}&url=${encodeURIComponent(window.location.href)}`, '_blank');
        }

        function copyArticleLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast("लिंक कॉपी हो गया!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function showError(message) {
            const container = document.getElementById('article-container');
            container.innerHTML = `
                <div class="text-center py-16 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
                    <h2 class="text-2xl font-bold text-red-600 mb-2">⚠️ आर्टिकल नहीं मिला!</h2>
                    <p class="text-gray-500 text-sm mb-6">${message}</p>
                    <a href="index.html" class="px-5 py-2 bg-red-600 text-white rounded font-bold text-sm hover:bg-red-700 transition">होमपेज पर जाएं</a>
                </div>
            `;
        }
    </script>
</body>
</html>s
