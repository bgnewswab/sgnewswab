<!DOCTYPE html>
<html lang="hi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SG News - ताज़ा ख़बरें</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#DC2626' } } }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <span class="bg-red-600 text-white font-extrabold text-2xl px-2.5 py-0.5 rounded shadow">SG</span>
                <span class="text-xl font-black text-red-600 dark:text-red-500">SG NEWS</span>
            </a>
            <a href="index.html" class="text-xs font-bold text-red-600 hover:underline">← मुख्य पृष्ठ पर लौटें</a>
        </div>
    </header>

    <!-- MAIN ARTICLE CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow" id="article-container">
        <div class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-red-600 border-t-transparent"></div>
            <p class="mt-2 text-sm text-gray-500">खबर लोड हो रही है...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 text-xs py-6 text-center border-t border-gray-800">
        © 2026 SG News Portal. All Rights Reserved.
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadArticle();
        });

        async function loadArticle() {
            const container = document.getElementById('article-container');
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                showError("कोई आर्टिकल ID नहीं दी गई है।");
                return;
            }

            // Cache-busting fetch from data/news.json or news.json fallback
            const paths = [
                `./data/news.json?v=${Date.now()}`,
                `./news.json?v=${Date.now()}`
            ];

            let articles = null;

            for (let path of paths) {
                try {
                    let res = await fetch(path, { cache: 'no-store' });
                    if (res.ok) {
                        articles = await res.json();
                        break;
                    }
                } catch (e) {
                    console.warn(`Failed path: ${path}`);
                }
            }

            if (!articles || !Array.isArray(articles)) {
                showError("खबरें लोड करने में समस्या हुई।");
                return;
            }

            // Find matching article by ID
            const article = articles.find(a => String(a.id) === String(articleId));

            if (!article) {
                showError("यह आर्टिकल नहीं मिला या हटा दिया गया है।");
                return;
            }

            // Render Full Article
            document.getElementById('page-title').innerText = `${article.title} - SG News`;
            
            container.innerHTML = `
                <article class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-xl shadow border border-gray-200 dark:border-gray-700">
                    <div class="flex items-center space-x-3 text-xs text-gray-500 mb-4">
                        <span class="bg-red-100 text-red-600 dark:bg-red-900 dark:text-red-200 font-bold px-2 py-0.5 rounded uppercase">${article.category || 'News'}</span>
                        <span>📅 ${article.date || 'आज'}</span>
                        <span>⏱️ ${article.readTime || '3 मिनट'}</span>
                        <span>👁️ ${article.views || '1k'} Views</span>
                    </div>

                    <h1 class="text-2xl md:text-4xl font-extrabold text-gray-900 dark:text-white leading-tight mb-6">
                        ${article.title}
                    </h1>

                    ${article.image ? `<img src="${article.image}" alt="${article.title}" class="w-full h-80 md:h-[400px] object-cover rounded-lg mb-6 shadow">` : ''}

                    <div class="prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-200 text-base leading-relaxed space-y-4">
                        ${article.content || `<p>${article.summary}</p>`}
                    </div>

                    <div class="mt-8 pt-4 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center">
                        <a href="index.html" class="text-sm font-bold text-red-600 hover:underline">← अन्य खबरें देखें</a>
                        <button onclick="navigator.clipboard.writeText(window.location.href); alert('लिंक कॉपी हो गया!');" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 p-2 rounded">🔗 शेयर करें</button>
                    </div>
                </article>
            `;
        }

        function showError(message) {
            const container = document.getElementById('article-container');
            container.innerHTML = `
                <div class="text-center py-16 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
                    <h2 class="text-2xl font-bold text-red-600 mb-2">⚠️ आर्टिकल नहीं मिला!</h2>
                    <p class="text-gray-500 text-sm mb-6">${message}</p>
                    <a href="index.html" class="px-5 py-2 bg-red-600 text-white rounded font-bold text-sm hover:bg-red-700 transition">होमपेज पर जाएं</a>
                </div>
            `;
        }
    </script>
</body>
</html>
