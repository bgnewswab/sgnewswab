<!DOCTYPE html>
<html lang="hi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SG News - खबर लोड हो रही है...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#DC2626' } } } }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <!-- Header / Nav -->
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <span class="bg-red-600 text-white font-black text-2xl px-2.5 py-0.5 rounded">SG</span>
                <span class="text-xl font-extrabold text-red-600">SG NEWS</span>
            </a>
            <a href="index.html" class="text-sm font-bold text-gray-600 dark:text-gray-300 hover:text-red-600">← मुख्य पृष्ठ पर लौटें</a>
        </div>
    </header>

    <!-- Main Article Body -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div id="loading" class="text-center py-20 text-gray-500">
            ⏳ आर्टिकल लोड हो रहा है...
        </div>

        <article id="article-content" class="hidden bg-white dark:bg-gray-800 p-6 md:p-10 rounded-xl shadow-md border border-gray-200 dark:border-gray-700">
            
            <!-- Category & Meta -->
            <div class="flex items-center gap-3 text-xs mb-3">
                <span id="art-category" class="font-extrabold uppercase px-2.5 py-1 rounded bg-red-100 dark:bg-red-900 text-red-600 dark:text-red-200"></span>
                <span id="art-date" class="text-gray-500 dark:text-gray-400"></span>
                <span class="text-gray-400">•</span>
                <span id="art-readtime" class="text-gray-500 dark:text-gray-400"></span>
            </div>

            <!-- Title -->
            <h1 id="art-title" class="text-2xl md:text-4xl font-extrabold leading-tight text-gray-900 dark:text-white mb-4"></h1>

            <!-- Author & Share -->
            <div class="flex justify-between items-center border-y border-gray-100 dark:border-gray-700 py-3 mb-6 text-xs text-gray-600 dark:text-gray-400">
                <div>रिपोर्टर: <strong id="art-author" class="text-gray-900 dark:text-gray-200"></strong></div>
                <button onclick="shareArticle()" class="bg-red-50 dark:bg-red-950 text-red-600 dark:text-red-300 px-3 py-1.5 rounded-full font-bold hover:bg-red-100">🔗 शेयर करें</button>
            </div>

            <!-- Main Featured Image -->
            <img id="art-image" class="w-full h-80 md:h-96 object-cover rounded-lg mb-6 shadow" src="" alt="">

            <!-- Article Content HTML -->
            <div id="art-body" class="prose dark:prose-invert max-w-none text-base md:text-lg leading-relaxed space-y-4 text-gray-800 dark:text-gray-200">
            </div>

            <!-- Tags Section -->
            <div class="mt-8 pt-4 border-t border-gray-100 dark:border-gray-700 flex flex-wrap gap-2" id="art-tags">
            </div>
        </article>

        <!-- Article Not Found Error State -->
        <div id="not-found" class="hidden text-center py-20">
            <h2 class="text-2xl font-bold text-red-600 mb-2">आर्टिकल नहीं मिला!</h2>
            <p class="text-gray-500 mb-4">यह खबर हटा दी गई है या लिंक गलत है।</p>
            <a href="index.html" class="bg-red-600 text-white px-4 py-2 rounded font-bold text-sm">होमपेज पर जाएं</a>
        </div>
    </main>

    <!-- Script to Fetch and Render Article dynamically -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // URL से Parameter निकाला (?id=1 या ?slug=abc)
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            const articleSlug = urlParams.get('slug');

            if (!articleId && !articleSlug) {
                showNotFound();
                return;
            }

            // fetch news.json
            fetch('./data/news.json')
                .then(response => {
                    if (!response.ok) throw new Error("JSON लोड करने में विफल");
                    return response.json();
                })
                .then(newsList => {
                    // Match by ID or Slug
                    const article = newsList.find(item => 
                        (articleId && item.id == articleId) || 
                        (articleSlug && item.slug === articleSlug)
                    );

                    if (article) {
                        renderArticleDetails(article);
                    } else {
                        showNotFound();
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    showNotFound();
                });
        });

        function renderArticleDetails(art) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('article-content').classList.remove('hidden');

            // Set Title & Meta SEO
            document.getElementById('page-title').innerText = `${art.title} - SG News`;
            document.getElementById('art-title').innerText = art.title;
            document.getElementById('art-category').innerText = art.category;
            document.getElementById('art-date').innerText = `📅 ${art.date}`;
            document.getElementById('art-readtime').innerText = `⏱️ ${art.readTime || '3 मिनट'}`;
            document.getElementById('art-author').innerText = art.author || 'SG News Bot';
            
            // Set Image & Content Body
            document.getElementById('art-image').src = art.image;
            document.getElementById('art-image').alt = art.title;
            document.getElementById('art-body').innerHTML = art.content;

            // Tags
            const tagsContainer = document.getElementById('art-tags');
            tagsContainer.innerHTML = '';
            if (art.tags && art.tags.length > 0) {
                art.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs px-2.5 py-1 rounded">#${tag}</span>`;
                });
            }
        }

        function showNotFound() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('not-found').classList.remove('hidden');
        }

        function shareArticle() {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("लिंक कॉपी हो गया है!");
            }
        }
    </script>
</body>
</html>
