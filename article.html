<!DOCTYPE html>
<html lang="hi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SG News - ताज़ा ख़बरें</title>
    
    <!-- PWA & Favicon Supports -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#DC2626">

    <!-- SEO Meta Tags -->
    <meta name="description" id="meta-description" content="SG News Portal - निष्पक्ष और सटीक खबरें।">
    <link rel="canonical" id="canonical-url" href="">
    <meta name="robots" content="index, follow, max-image-preview:large">
    
    <!-- Open Graph (Facebook/WhatsApp) -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="SG News">
    <meta property="og:title" id="og-title" content="SG News">
    <meta property="og:description" id="og-description" content="SG News Portal">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitter-title" content="SG News">
    <meta name="twitter:description" id="twitter-description" content="SG News Portal">
    <meta name="twitter:image" id="twitter-image" content="">

    <!-- Google News Schema + Breadcrumb Schema -->
    <script type="application/ld+json" id="news-schema"></script>
    <script type="application/ld+json" id="breadcrumb-schema"></script>

    <!-- Pre-theme Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: '#DC2626' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

    <!-- Reading Progress Bar -->
    <div id="progress-bar" class="fixed top-0 left-0 h-1 bg-red-600 z-50 transition-all duration-150 w-0"></div>

    <!-- HEADER -->
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-0 z-40 shadow-sm" role="banner">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
            <a href="index.html" class="flex items-center space-x-3" aria-label="SG News Homepage">
                <span class="bg-red-600 text-white font-extrabold text-2xl px-2.5 py-0.5 rounded shadow">SG</span>
                <span class="text-xl font-black text-red-600 dark:text-red-500 tracking-wide">SG NEWS</span>
            </a>
            
            <div class="flex items-center space-x-3">
                <form id="search-form" onsubmit="handleSearch(event)" class="hidden md:flex items-center">
                    <input type="text" id="search-input" placeholder="खबरें खोजें..." class="px-3 py-1 text-xs border rounded-l bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-1 focus:ring-red-600">
                    <button type="submit" class="bg-red-600 text-white px-2.5 py-1 rounded-r text-xs font-bold hover:bg-red-700">🔍</button>
                </form>

                <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle Theme" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
                <a href="index.html" class="text-xs font-bold text-red-600 hover:underline hidden sm:inline">← मुख्य पृष्ठ</a>
            </div>
        </div>
    </header>

    <!-- MAIN ARTICLE CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow" id="main-content" role="main">
        
        <!-- Breadcrumb -->
        <nav id="breadcrumb" class="text-xs text-gray-500 dark:text-gray-400 mb-4 hidden" aria-label="Breadcrumb">
            <a href="index.html" class="hover:underline">होम</a> &gt; 
            <span id="crumb-category" class="font-medium text-gray-700 dark:text-gray-300">समाचार</span> &gt; 
            <span id="crumb-title" class="truncate inline-block max-w-[180px] sm:max-w-[300px] align-bottom">लोड हो रहा है...</span>
        </nav>

        <div id="article-container">
            <!-- Skeleton Loader -->
            <div class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-xl shadow border border-gray-200 dark:border-gray-700 animate-pulse">
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/4 mb-4"></div>
                <div class="h-8 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mb-4"></div>
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mb-6"></div>
                <div class="w-full h-80 bg-gray-200 dark:bg-gray-700 rounded-lg mb-6"></div>
                <div class="space-y-3">
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-full"></div>
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-full"></div>
                </div>
            </div>
        </div>

        <nav id="prev-next-nav" class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4 hidden" aria-label="Previous and Next Articles"></nav>

        <section id="related-news-section" class="mt-10 hidden">
            <h3 class="text-xl font-bold mb-4 pb-2 border-b-2 border-red-600 inline-block">संबंधित खबरें</h3>
            <div id="related-news-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 text-xs py-6 text-center border-t border-gray-800 mt-12" role="contentinfo">
        <p>© 2026 SG News Portal. All Rights Reserved.</p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2" role="alert">
        <span>✅</span>
        <span id="toast-message">संदेश</span>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let speechSynthesisUtterance = null;

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle-icon').innerText = isDark ? '☀️' : '🌙';
        }

        window.addEventListener("scroll", () => {
            const win = document.documentElement;
            const sc = (win.scrollTop) / (win.scrollHeight - win.clientHeight);
            document.getElementById("progress-bar").style.width = (sc * 100) + "%";
        });

        document.addEventListener("DOMContentLoaded", () => {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-toggle-icon').innerText = isDark ? '☀️' : '🌙';
            loadArticle();
        });

        async function loadArticle() {
            const container = document.getElementById('article-container');
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                showError("कोई आर्टिकल ID नहीं दी गई है।");
                return;
            }

            const buildVersion = new Date().getTime(); 
            let articles = null;

            try {
                // FIXED: Absolute Path for Github Pages Data Loading
                let jsonUrl = `https://bgnewswab.github.io/sgnewswab/data/news.json?v=${buildVersion}`;
                let res = await fetch(jsonUrl, { cache: 'no-cache' });
                
                if (!res.ok) {
                    // Fallback to relative path if fetched locally
                    res = await fetch(`./data/news.json?v=${buildVersion}`);
                }

                if (res.ok) {
                    articles = await res.json();
                }
            } catch (e) {
                console.warn("news.json fetch failed", e);
            }

            if (!articles || !Array.isArray(articles)) {
                showError("खबरें लोड करने में समस्या हुई। कृपया डाटा फ़ाइल जाँचें।");
                return;
            }

            const currentIndex = articles.findIndex(a => String(a.id) === String(articleId));
            const article = articles[currentIndex];

            if (!article) {
                showError("यह आर्टिकल नहीं मिला या हटा दिया गया है।");
                return;
            }

            const fullContent = article.content || article.summary || '';
            const cleanText = fullContent.replace(/<[^>]+>/g, '');
            const wordCount = cleanText.trim().split(/\s+/).length;
            const autoReadTime = `${Math.max(1, Math.ceil(wordCount / 150))} मिनट`;

            updateSEOAndSchema(article);

            document.getElementById('crumb-category').innerText = article.category || 'समाचार';
            document.getElementById('crumb-title').innerText = article.title;
            document.getElementById('breadcrumb').classList.remove('hidden');

            container.innerHTML = `
                <article class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-xl shadow border border-gray-200 dark:border-gray-700">
                    <div class="flex flex-wrap items-center gap-3 text-xs text-gray-500 mb-4">
                        <span class="bg-red-100 text-red-600 dark:bg-red-900 dark:text-red-200 font-bold px-2 py-0.5 rounded uppercase">${article.category || 'General'}</span>
                        <span>📅 Published: ${article.publishedDate || article.date || 'आज'}</span>
                        ${article.updatedDate ? `<span>🔄 Updated: ${article.updatedDate}</span>` : ''}
                        <span>⏱️ ${autoReadTime}</span>
                        <span>👁️ ${article.views || '1k'} Views</span>
                        <span class="text-gray-700 dark:text-gray-300 font-medium">✍️ By ${article.author || 'SG News Desk'}</span>
                    </div>

                    <h1 class="text-2xl md:text-4xl font-extrabold text-gray-900 dark:text-white leading-tight mb-4">
                        ${article.title}
                    </h1>

                    <div class="flex items-center space-x-2 bg-gray-50 dark:bg-gray-700/50 p-2.5 rounded-lg mb-6 border dark:border-gray-600 text-xs">
                        <span class="font-bold">🔊 खबर सुनें:</span>
                        <button onclick="readAloud('${encodeURIComponent(cleanText)}')" class="px-2.5 py-1 bg-red-600 text-white rounded hover:bg-red-700">▶ चलाएं</button>
                        <button onclick="pauseRead()" class="px-2.5 py-1 bg-gray-200 dark:bg-gray-600 rounded">⏸️ रोकें</button>
                        <button onclick="stopRead()" class="px-2.5 py-1 bg-gray-200 dark:bg-gray-600 rounded">⏹️ बंद करें</button>
                    </div>

                    ${article.image ? `
                        <div class="mb-6">
                            <img src="${article.image}" 
                                 alt="${article.title}" 
                                 width="1200" 
                                 height="675"
                                 fetchpriority="high"
                                 onerror="this.onerror=null; this.src='https://via.placeholder.com/1200x675?text=SG+News';"
                                 class="w-full h-auto max-h-[450px] object-cover rounded-lg shadow">
                            ${article.caption ? `<p class="text-xs text-gray-500 mt-1 text-center">${article.caption}</p>` : ''}
                        </div>
                    ` : ''}

                    <div class="prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-200 text-base leading-relaxed space-y-4">
                        ${article.content || `<p>${article.summary}</p>`}
                    </div>

                    <div id="article-ad" class="my-6 min-h-[90px] bg-gray-50 dark:bg-gray-700/40 border border-dashed border-gray-300 dark:border-gray-600 rounded flex items-center justify-center text-xs text-gray-400">
                    </div>

                    ${article.tags ? `
                        <div class="mt-6 flex flex-wrap gap-2">
                            ${article.tags.map(tag => `<span class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2.5 py-1 rounded-full">#${tag}</span>`).join('')}
                        </div>
                    ` : ''}

                    <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-xs font-bold text-gray-500">शेयर करें:</span>
                            <button onclick="shareNative('${encodeURIComponent(article.title)}')" class="p-2 bg-red-600 text-white rounded-lg text-xs font-bold hover:bg-red-700">📤 शेयर</button>
                            <button onclick="shareWhatsApp('${encodeURIComponent(article.title)}')" class="p-2 bg-green-600 text-white rounded-lg text-xs font-bold">WhatsApp</button>
                            <button onclick="shareTelegram('${encodeURIComponent(article.title)}')" class="p-2 bg-sky-500 text-white rounded-lg text-xs font-bold">Telegram</button>
                            <button onclick="shareFacebook()" class="p-2 bg-blue-600 text-white rounded-lg text-xs font-bold">Facebook</button>
                        </div>
                        <a href="index.html" class="text-sm font-bold text-red-600 hover:underline">← मुख्य पृष्ठ पर जाएं</a>
                    </div>
                </article>
            `;

            renderPrevNext(articles, currentIndex);
            renderRelatedNews(articles, article);
        }

        function updateSEOAndSchema(article) {
            const currentUrl = window.location.href;
            const summary = article.summary || article.title;

            document.getElementById('page-title').innerText = `${article.title} - SG News`;
            document.getElementById('meta-description').content = summary;
            document.getElementById('canonical-url').href = currentUrl;

            ['og-title', 'twitter-title'].forEach(id => document.getElementById(id).content = article.title);
            ['og-description', 'twitter-description'].forEach(id => document.getElementById(id).content = summary);
            ['og-image', 'twitter-image'].forEach(id => document.getElementById(id).content = article.image || '');
            document.getElementById('og-url').content = currentUrl;
        }

        function renderPrevNext(articles, index) {
            const nav = document.getElementById('prev-next-nav');
            const prev = articles[index + 1];
            const next = articles[index - 1];

            nav.innerHTML = `
                ${prev ? `
                    <a href="article.html?id=${prev.id}" class="p-3 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-red-600 transition flex flex-col">
                        <span class="text-[10px] text-gray-400 font-bold uppercase">← पिछली खबर</span>
                        <span class="text-xs font-bold text-gray-800 dark:text-gray-200 line-clamp-1">${prev.title}</span>
                    </a>
                ` : '<div></div>'}
                ${next ? `
                    <a href="article.html?id=${next.id}" class="p-3 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-red-600 transition flex flex-col text-right">
                        <span class="text-[10px] text-gray-400 font-bold uppercase">अगली खबर →</span>
                        <span class="text-xs font-bold text-gray-800 dark:text-gray-200 line-clamp-1">${next.title}</span>
                    </a>
                ` : '<div></div>'}
            `;
            nav.classList.remove('hidden');
        }

        function renderRelatedNews(allArticles, currentArticle) {
            const grid = document.getElementById('related-news-grid');
            const section = document.getElementById('related-news-section');

            const filtered = allArticles
                .filter(a => String(a.id) !== String(currentArticle.id))
                .slice(0, 6);

            if (filtered.length === 0) return;

            grid.innerHTML = filtered.map(item => `
                <a href="article.html?id=${item.id}" class="flex flex-col bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden hover:shadow-md transition">
                    ${item.image ? `<img src="${item.image}" alt="${item.title}" width="400" height="225" loading="lazy" class="w-full h-32 object-cover">` : ''}
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <h4 class="text-xs font-bold text-gray-900 dark:text-white line-clamp-2 mb-2">${item.title}</h4>
                        <span class="text-[10px] text-gray-400">📅 ${item.date || 'आज'}</span>
                    </div>
                </a>
            `).join('');

            section.classList.remove('hidden');
        }

        function readAloud(encodedText) {
            window.speechSynthesis.cancel();
            const text = decodeURIComponent(encodedText);
            speechSynthesisUtterance = new SpeechSynthesisUtterance(text);
            speechSynthesisUtterance.lang = 'hi-IN';
            window.speechSynthesis.speak(speechSynthesisUtterance);
        }
        function pauseRead() { window.speechSynthesis.pause(); }
        function stopRead() { window.speechSynthesis.cancel(); }

        async function shareNative(title) {
            const shareData = { title: decodeURIComponent(title), url: window.location.href };
            if (navigator.share) {
                try { await navigator.share(shareData); } catch (e) {}
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast("लिंक कॉपी हो गया!");
            }
        }
        function shareWhatsApp(title) { window.open(`https://api.whatsapp.com/send?text=${title}%20${encodeURIComponent(window.location.href)}`, '_blank'); }
        function shareTelegram(title) { window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${title}`, '_blank'); }
        function shareFacebook() { window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank'); }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (query) window.location.href = `index.html?search=${encodeURIComponent(query)}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }

        function showError(msg) {
            document.getElementById('article-container').innerHTML = `
                <div class="text-center py-16 bg-white dark:bg-gray-800 rounded-xl border p-6">
                    <h2 class="text-2xl font-bold text-red-600 mb-2">⚠️ त्रुटि</h2>
                    <p class="text-gray-500 text-sm mb-6">${msg}</p>
                    <a href="index.html" class="px-5 py-2 bg-red-600 text-white rounded font-bold text-sm">होमपेज पर जाएं</a>
                </div>
            `;
        }
    </script>
</body>
</html>
